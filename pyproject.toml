[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "khcm-traffic-analyzer"
version = "1.8.5"
description = "Extensible KHCM-based traffic analysis desktop application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8",
  "openpyxl>=3.1",
  "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.0"]

[project.gui-scripts]
khcm-traffic-analyzer = "arterial_analysis.app_fast:main"

[tool.setuptools.packages.find]
where = ["src"]
